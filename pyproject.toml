[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontology-core"
version = "0.4.0"
description = "Generic ontology engine for semantic data layers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["ontology_core"]
